name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        emacs_version: [28.1, 29.4, 30.1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install dependencies (MELPA)
        run: |
          emacs -Q --batch \
            --eval "(progn (require 'package)
                           (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
                           (package-refresh-contents)
                           (dolist (p '(visual-regexp package-lint))
                             (package-install p)))"

      - name: Byte-compile (warnings as errors)
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile visual-regexp-rx.el

      - name: package-lint
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            -l ci/package-lint-check.el

      - name: checkdoc
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            --eval "(progn (checkdoc-file \"visual-regexp-rx.el\")
                           (let ((buf (get-buffer \"*Warnings*\")))
                             (if (and buf
                                      (string-match-p \"Warning (emacs)\"
                                                      (with-current-buffer buf (buffer-string))))
                                 (progn
                                   (princ (with-current-buffer buf (buffer-string)))
                                   (kill-emacs 1))
                               (princ \"checkdoc: clean\\n\"))))"

      - name: ERT
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            -l test/visual-regexp-rx-tests.el \
            -f ert-run-tests-batch-and-exit
