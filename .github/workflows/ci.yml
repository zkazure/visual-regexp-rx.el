name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        emacs_version: [28.1, 29.4, 30.1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Install dependencies (MELPA)
        run: |
          emacs -Q --batch \
            --eval "(progn (require 'package)
                           (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
                           (package-refresh-contents)
                           (dolist (p '(visual-regexp package-lint))
                             (package-install p)))"

      - name: Byte-compile (warnings as errors)
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile visual-regexp-rx.el

      - name: package-lint
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            --eval "(progn (require 'package-lint)
                           (find-file \"visual-regexp-rx.el\")
                           (let ((issues (package-lint-buffer)))
                             (if issues
                                 (progn
                                   (dolist (i issues)
                                     (princ (format \"%d:%d: %s: %s\\n\"
                                                    (nth 0 i) (nth 1 i) (nth 2 i) (nth 3 i))))
                                   (kill-emacs 1))
                               (princ \"package-lint: clean\\n\"))))"

      - name: checkdoc
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            --eval "(progn (find-file \"visual-regexp-rx.el\")
                           (let ((warnings (checkdoc-eval-current-buffer t)))
                             (if warnings
                                 (progn
                                   (princ (format \"checkdoc issues:\n%s\n\" warnings))
                                   (kill-emacs 1))
                               (princ \"checkdoc: clean\n\"))))"

      - name: ERT
        run: |
          emacs -Q --batch -L . \
            --eval "(progn (require 'package) (package-initialize))" \
            -l test/visual-regexp-rx-tests.el \
            -f ert-run-tests-batch-and-exit
